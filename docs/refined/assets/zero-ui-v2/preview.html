<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zero · UI v2 交互设计</title>
<style>
:root{--bg:#FAFAF8;--surface:#fff;--subtle:#EFEFEC;--text:#17191B;--muted:#62666A;--line:#DADCD8;--accent:#147A58;color-scheme:light}body.dark{--bg:#121416;--surface:#1C1F22;--subtle:#292D30;--text:#F4F5F2;--muted:#B5BABD;--line:#42484B;--accent:#78D8AF;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,'Microsoft YaHei',sans-serif}button,input{font:inherit}button{min-height:48px;min-width:48px;border:0;cursor:pointer;color:inherit;background:transparent;border-radius:16px}button:hover{background:var(--subtle)}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.toolbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:12px;font-size:13px}.toolbar strong{letter-spacing:.08em}.toolbar .spacer{flex:1}.shell{display:grid;grid-template-columns:244px minmax(0,1fr);height:calc(100dvh - 64px);min-height:600px}aside{padding:28px 16px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px}.brand{display:flex;align-items:center;gap:10px;font-size:24px;letter-spacing:.06em;font-weight:700;padding:0 12px 22px}.brand img{width:38px;height:38px}nav button{display:block;width:100%;text-align:left;padding:10px 16px;margin-bottom:5px}.selected{background:var(--subtle)}.label{font-size:12px;color:var(--muted);padding:16px 16px 4px}.recent{padding:8px 16px;font-size:14px;color:var(--muted)}.account{margin-top:auto;padding:16px;border-top:1px solid var(--line)}main{display:flex;flex-direction:column;min-width:0}.top{height:80px;padding:12px 30px;display:flex;align-items:center;gap:8px}.top .title{font-weight:600;font-size:18px}.status{margin-left:auto;font-size:13px;color:var(--muted);padding:8px 14px}.dot{display:inline-block;width:7px;height:7px;background:var(--accent);border-radius:50%;margin-right:7px}.feed{overflow:auto;flex:1;padding:28px max(24px,calc((100% - 760px)/2));scroll-behavior:smooth}.user{margin:8px 0 32px auto;max-width:80%;width:fit-content;padding:13px 20px;border-radius:24px;background:var(--subtle)}.answer{max-width:680px}.answer h1{font-size:26px;line-height:1.4;margin:0 0 18px;font-weight:550}.answer p{margin:0 0 18px}.card{border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:24px 0;display:flex;gap:14px;align-items:center;background:var(--surface)}.check{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--bg);text-align:center;line-height:28px}.meta{color:var(--muted);font-size:13px}.card button{margin-left:auto}.source{display:inline-block;font-size:12px;color:var(--muted);background:var(--subtle);padding:4px 10px;border-radius:8px}.actions{display:flex;gap:6px;margin:20px 0;color:var(--muted)}.composeWrap{padding:16px max(24px,calc((100% - 800px)/2)) 22px}.composer{border:1px solid var(--line);border-radius:28px;background:var(--surface);display:flex;align-items:center;padding:8px;gap:8px}.composer input{background:transparent;border:0;min-width:0;flex:1;padding:8px;color:var(--text)}.send{background:var(--text);color:var(--bg);border-radius:50%;font-size:25px}.hint{text-align:center;font-size:11px;color:var(--muted);margin-top:10px}.panel{position:fixed;right:24px;top:140px;width:340px;max-width:calc(100vw - 32px);padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 60px #0002;z-index:3;animation:arrive 180ms cubic-bezier(.2,0,0,1)}.panel header{display:flex;align-items:center;justify-content:space-between;font-size:20px}.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.pulse{width:40px;height:40px;vertical-align:middle}.hidden{display:none!important}.menu{display:none}.contentPage{max-width:740px}.contentPage h1{font-size:30px}.soft{color:var(--muted)}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}body.compact .shell{grid-template-columns:1fr;max-width:440px;margin:auto;border-inline:1px solid var(--line)}body.compact aside{display:none}body.compact .menu{display:block}body.compact .feed{padding:20px}body.compact .top{padding:8px 12px}body.compact .composeWrap{padding:12px}body.reduce .pulse{display:none}body.reduce *{animation:none!important;scroll-behavior:auto!important}@media(max-width:700px){.shell{grid-template-columns:1fr}aside{display:none}.menu{display:block}.toolbar{padding:0 12px}.toolbar strong{display:none}.top{padding:8px 16px}.feed{padding:20px}.composeWrap{padding:12px}.toolbar button{font-size:12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="toolbar"><strong>ZERO / 设计预览</strong><span class="spacer"></span><button id="theme">深色模式</button><button id="size">窄屏预览</button><button id="motion">减少动态</button></div>
<div class="shell"><aside><div class="brand"><img src="zero-icon.svg" alt="Zero标识">ZERO</div><nav><button class="selected" data-page="chat">◯　对话</button><button data-page="library">▤　资料</button><button data-page="workspace">⌘　工作区</button><button data-page="settings">⚙　设置</button></nav><div class="label">最近会话</div><div class="recent">整理本周的阅读笔记</div><div class="recent">我的个人知识库</div><div class="account">本地个人空间<br><span class="meta">你的资料，始终可管理</span></div></aside>
<main><div class="top"><button class="menu" id="menu" aria-label="打开导航">☰</button><span class="title" id="pageTitle">Zero</span><button class="status" id="status"><span class="dot"></span>系统就绪</button><button id="newChat" aria-label="新建对话">＋</button></div><div class="feed" id="feed"><section id="chat"><div class="user">帮我整理阅读笔记，并改进摘要模块。</div><article class="answer"><h1>资料已经整理好了。</h1><p>我将笔记归纳为三个主题，并保留了原文引用。你以后可以直接按主题提问。</p><span class="source">↗ 阅读笔记 · 3 条引用</span><div class="card"><span class="check">✓</span><div><strong>摘要模块已更新</strong><div class="meta">样例状态 · 验证通过，可撤回</div></div><button id="release" aria-label="查看模块版本">↗</button></div><p>新版已完成限定范围试运行。你可以在工作区查看版本变化，或恢复上一版本。</p><div class="actions"><button aria-label="复制回复" id="copy">⧉</button><button aria-label="播放回复" id="voice">♬</button><button aria-label="重新生成" id="retry">↻</button></div></article></section><section id="other" class="contentPage hidden"></section></div><div class="composeWrap"><div class="composer"><button id="attach" aria-label="添加附件">＋</button><input id="message" aria-label="消息" placeholder="与 Zero 对话…"><button id="mic" aria-label="语音输入">♩</button><button class="send" id="send" aria-label="发送消息">↑</button></div><div class="hint">交互设计样例 · 未连接真实系统、模型或设备</div></div></main></div>
<section id="panel" class="panel hidden" role="dialog" aria-modal="false" aria-labelledby="panelTitle"><header><strong id="panelTitle">系统状态</strong><button id="close" aria-label="关闭面板">×</button></header><div id="panelBody"></div></section>
<script>
const $=id=>document.getElementById(id);let previousFocus;function panel(title,html){previousFocus=document.activeElement;$('panelTitle').textContent=title;$('panelBody').innerHTML=html;$('panel').classList.remove('hidden');$('close').focus()}function closePanel(){$('panel').classList.add('hidden');previousFocus?.focus()}$('close').onclick=closePanel;document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'浅色模式':'深色模式'};$('size').onclick=()=>{document.body.classList.toggle('compact');$('size').textContent=document.body.classList.contains('compact')?'展开屏幕':'窄屏预览'};$('motion').onclick=()=>{document.body.classList.toggle('reduce');$('motion').textContent=document.body.classList.contains('reduce')?'启用动态':'减少动态'};
const pages={library:['资料','<p class="soft">知识与记忆，各有来源，随时可更正。</p><div class="card"><div><strong>知识库</strong><div class="meta">阅读笔记 · 索引可用</div></div></div><div class="card"><div><strong>我的记忆</strong><div class="meta">偏好和事实 · 查看、编辑、删除</div></div></div>'],workspace:['工作区','<p class="soft">查看任务进展与可撤回的能力更新。</p><div class="card"><span class="check">✓</span><div><strong>摘要模块 v2</strong><div class="meta">当前版本 · 上一健康版本 v1</div></div></div><p>需要新增权限的模块会先向你展示提案。</p>'],settings:['设置','<div class="card"><div><strong>角色与表达</strong><div class="meta">长期熟悉度 · 当前会话情绪 · 分别重置</div></div></div><div class="card"><div><strong>模型与权限</strong><div class="meta">查看已连接能力</div></div></div>']};function page(key){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('selected',b.dataset.page===key));$('chat').classList.toggle('hidden',key!=='chat');$('other').classList.toggle('hidden',key==='chat');$('pageTitle').textContent=key==='chat'?'Zero':pages[key][0];if(key!=='chat')$('other').innerHTML='<h1>'+pages[key][0]+'</h1>'+pages[key][1]}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));$('menu').onclick=()=>{panel('导航','<div id="mobileNav"></div>');for(const [key,label]of[['chat','对话'],['library','资料'],['workspace','工作区'],['settings','设置']]){let b=document.createElement('button');b.textContent=label;b.style.display='block';b.onclick=()=>{page(key);closePanel()};$('mobileNav').appendChild(b)}};
$('status').onclick=()=>panel('系统状态','<p class="meta">设计样例 · 所有值为虚构展示</p><div class="kv"><span>对话模型</span><span>可用</span></div><div class="kv"><span>Termux 工作站</span><span>就绪</span></div><div class="kv"><span>资料索引</span><span>可用</span></div><div class="kv"><span>后台任务</span><span>无</span></div>');$('release').onclick=()=>panel('模块版本','<p>摘要模块 v2</p><p class="meta">已验证输入/输出契约，保留上一健康版本。</p><button id="rollback">恢复 v1（样例）</button>');document.addEventListener('click',e=>{if(e.target.id==='rollback')panel('版本已恢复','<p>样例状态：当前版本 v1。</p>')});$('newChat').onclick=()=>{page('chat');$('chat').innerHTML='<article class="answer"><h1>今天想做些什么？</h1><p class="soft">可以从一个问题、一张图片或一份资料开始。</p></article>'};function send(){const t=$('message').value.trim();if(!t)return;page('chat');const p=document.createElement('div');p.className='user';p.textContent=t;$('chat').appendChild(p);const a=document.createElement('p');a.textContent='这是交互预览，消息未发送到任何模型。';$('chat').appendChild(a);$('message').value='';$('feed').scrollTop=$('feed').scrollHeight}$('send').onclick=send;$('message').onkeydown=e=>{if(e.key==='Enter')send()};$('attach').onclick=()=>panel('添加内容','<button>图片（样例）</button><button>文件（样例）</button>');$('mic').onclick=()=>panel('语音输入','<p>设计样例：未启用麦克风。</p><img class="pulse" src="zero-activity.svg" alt="处理状态动效样例">');$('voice').onclick=()=>panel('播放回复','<p>设计样例：未启用音频。</p>');$('copy').onclick=()=>panel('复制回复','<p>设计样例：可复制内容应包含正文与引用。</p>');$('retry').onclick=()=>panel('重新生成','<p>设计样例：保留原回复作为分支，重新生成新回复。</p>');
</script></body></html>
