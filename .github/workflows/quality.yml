name: Zero quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0
      - name: Check public tree
        run: |
          python scripts/check_public_tree.py
          python scripts/check_public_tree.py --history HEAD
      - name: Check publisher helpers
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Obtain hash-pinned runtime dependencies
        run: python scripts/bootstrap_runtime.py
      - name: Test, lint and compile
        run: ./gradlew qualityCheck assembleDebug --no-daemon --no-parallel --max-workers=2 --console=plain
