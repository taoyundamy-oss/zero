# Zero docker-socket-proxy（D102 端点白名单 · nginx 实现）
# 原因：tecnativa/docker-socket-proxy 不在 DaoCloud 镜像白名单（E4），以本地已有
# nginx:1.27-alpine 实现同语义——仅放行 /_ping 与 /containers*，其余一律 403。
# 仅监听 sandbox-net（2375），宿主不映射端口。

server {
    listen 2375;

    # docker-py 版本协商探活（/_ping + /version，均只读无安全面）
    location = /_ping {
        proxy_pass http://unix:/var/run/docker.sock;
        proxy_http_version 1.1;
    }
    location = /version {
        proxy_pass http://unix:/var/run/docker.sock;
        proxy_http_version 1.1;
    }

    # 容器生命周期白名单：create/start/stop/wait/logs/inspect/remove（GET/POST/DELETE）
    # （C2.4b IO 走双 bind 通道 Z26——零 archive API 依赖，PUT 试开已回收）
    # 正则匹配可选版本前缀——docker-py 请求 /v1.55/containers/create 形式
    location ~ ^(/v[0-9.]+)?/containers {
        limit_except GET POST DELETE { deny all; }
        proxy_pass http://unix:/var/run/docker.sock;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;   # container.wait 长轮询
        proxy_send_timeout 300s;
        proxy_buffering off;       # logs 流式
    }

    # 其余端点（images/exec/build/...）全部拒绝
    location / {
        default_type application/json;
        return 403 '{"error":"docker endpoint not allowed (D102)"}';
    }
}
