# Zero Cloud — nginx 反代（C0.1 · IP + 自签证书版）
# 大陆 ECS 对未备案域名的拦截为 SNI 级、与端口无关（实测确认）→ 域名不可用
# 方案：IP 直连 + 自签证书（10 年，SAN=IP）+ Android 端指纹固定（防中间人）
# 证书：/etc/nginx/certs/（私钥服务器端生成，不出服务器）

# WebSocket/SSE 升级兼容（MCP streamable HTTP）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 限流：每 IP 10r/s（D90）
limit_req_zone $binary_remote_addr zone=zero_api:10m rate=10r/s;

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 上传配额：MAX_FILE_SIZE_MB=2048（二进制直传，留协议开销余量）
    client_max_body_size 2560m;
    # 蜂窝网络慢上传容忍：两次读间最长等待（缺省 60s 对大文件移动网络偏紧）
    client_body_timeout 300s;

    # 长工具调用（research / download 轮询）
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        limit_req zone=zero_api burst=20 nodelay;
        # Docker DNS 动态解析：gateway 重建后 IP 变化，静态 upstream 会指向旧 IP（E11）
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_gateway http://gateway:8000;
        proxy_pass $upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
